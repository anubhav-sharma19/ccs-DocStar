name: check_release

on:
  push:
  pull_request:

jobs:
  zero-network:
    # macOS arm64: test_tamper.sh tampers the vendored mac-arm64 dylib.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
      - uses: android-actions/setup-android@v3
      - name: Install build-tools and NDK
        run: sdkmanager "build-tools;36.0.0" "ndk;28.2.13676358" "platforms;android-36"
      - name: Zero-network release guard
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: scripts/check_release.sh
