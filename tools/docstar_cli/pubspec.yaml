name: docstar_cli
description: DocStar macOS CLI. Batch metrics for local PDFs; --visual draws layout overlays (words, lines, blocks, table grids).
publish_to: none

environment:
  sdk: ^3.13.0

dependencies:
  # pinned: PDFium chromium/7811 (vendored)
  pdfrx_engine: 0.8.0
  docstar_core:
    path: ../../packages/docstar_core
  docstar_pdfium:
    path: ../../packages/docstar_pdfium
  docstar_engine:
    path: ../../packages/docstar_engine
  crypto: ^3.0.7
  image: ^4.8.0

dev_dependencies:
  test: ^1.25.0

# Vendored, hash-pinned PDFium (no build-time download). Required in every root app; see README "Using DocStar".
dependency_overrides:
  pdfium_dart:
    path: ../../third_party/pdfium_dart
